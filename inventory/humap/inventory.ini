# Cluster humap-v2 — 3 control-planes com etcd empilhado + 2 workers
# Nomes e IPs conforme a tabela do §2.1 do Manual de Migração.
# VIP 10.42.1.66 (kube-vip) e pool do MetalLB 10.42.1.221–.230 confirmados para esta rede.

[kube_control_plane]
humap-vp-k8s01 ansible_host=10.42.1.50 ip=10.42.1.50 etcd_member_name=etcd1
humap-vp-k8s02 ansible_host=10.42.1.51 ip=10.42.1.51 etcd_member_name=etcd2
humap-vp-k8s03 ansible_host=10.42.1.52 ip=10.42.1.52 etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
humap-vp-k8s04 ansible_host=10.42.1.53 ip=10.42.1.53 node_labels="{'redis-node': 'true'}"
humap-vp-k8s05 ansible_host=10.42.1.54 ip=10.42.1.54 node_labels="{'redis-node': 'true'}"
humap-vp-k8s06 ansible_host=10.42.1.55 ip=10.42.1.55 node_labels="{'redis-node': 'true'}"

[k8s_cluster:children]
kube_control_plane
kube_node

[all:vars]
ansible_user=christian
# SSH na porta 2200 desde a blindagem de 18/10/2026 (ufw: só 10.42.3.235–250 e 10.0.10.0/24)
ansible_port=2200
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Não definir ansible_become aqui: ele sobrepõe o "become: false" das tarefas que
# rodam na estação local (ex.: cópia do admin.conf). Use -b no ansible-playbook.
